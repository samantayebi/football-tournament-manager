{% extends "base.html" %}

{% block content %}
  <div class="tournament-detail-page">
    <p class="tournament-back">
      <a href="/">— Back to tournaments</a>
    </p>
    <h1 class="tournament-title">{{ tournament.name }}</h1>

    <div class="tournament-layout">
      <div class="tournament-panel">
        <section>
          <h2 class="tournament-section-title">Teams</h2>
          {% include "partials/_teams.html" %}
        </section>
      </div>
      <div id="match-and-standings" class="match-standings-area">
        <section>
          <h2 class="tournament-section-title">Matches &amp; Results</h2>
          {% include "partials/_matches.html" %}
        </section>
        <section>
          <h2 class="tournament-section-title">Standings</h2>
          {% include "partials/_standings.html" %}
        </section>
      </div>
    </div>
  </div>
{% endblock %}
