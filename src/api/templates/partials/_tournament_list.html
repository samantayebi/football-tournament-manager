{% if message %}
  <p class="alert alert--success">{{ message }}</p>
{% endif %}
{% if error %}
  <p class="alert alert--error">{{ error }}</p>
{% endif %}

{% if tournaments %}
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Link</th>
      </tr>
    </thead>
    <tbody>
      {% for tournament in tournaments %}
        <tr>
          <td>{{ tournament.name }}</td>
          <td>
            <a href="/tournaments/{{ tournament.id }}">View</a>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <p>No tournaments yet.</p>
{% endif %}
