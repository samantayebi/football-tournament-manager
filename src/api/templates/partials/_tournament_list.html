{% if message %}
  <p id="flash-message" class="alert alert--success">{{ message }}</p>
{% endif %}
{% if error %}
  <p class="alert alert--error">{{ error }}</p>
{% endif %}

{% if tournaments %}
  <table class="tournaments-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Link</th>
      </tr>
    </thead>
    <tbody>
      {% for tournament in tournaments %}
        <tr>
          <td>{{ tournament.name }}</td>
          <td>
            <a href="/tournaments/{{ tournament.id }}" class="view-link">View</a>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <div class="empty-state">
    <p class="empty-state__message">No tournaments yet. Create your first tournament above!</p>
  </div>
{% endif %}
