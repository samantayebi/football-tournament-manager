<div id="teams-section">
  <form
    hx-post="/ui/tournaments/{{ tournament.id }}/teams"
    hx-target="#teams-section"
    hx-swap="outerHTML"
  >
    <label for="team-name">Add team</label>
    <input id="team-name" name="name" type="text" placeholder="Team name" required />
    <button type="submit">Add team</button>
  </form>

  {% if message %}
    <p class="alert alert--success">{{ message }}</p>
  {% endif %}
  {% if error %}
    <p class="alert alert--error">{{ error }}</p>
  {% endif %}

  {% if tournament.teams %}
    <table>
      <thead>
        <tr>
          <th>Team</th>
        </tr>
      </thead>
      <tbody>
        {% for team in tournament.teams %}
          <tr>
            <td>{{ team.name }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No teams yet.</p>
  {% endif %}
</div>
